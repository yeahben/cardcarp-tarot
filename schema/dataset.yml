# Card fields worth filtering on. Written to dist/properties.json.
card_properties:
  - category
  - trait
  - type
  - element

# Deck fields worth filtering on.
deck_properties:
  - format
  - group
  - theme

# Collection types, in display order. The first is this game's primary type.
# A type in the data but not listed here still appears, sorted after these.
collection_types:
  - Divinatory
  - Playing
  - Extra
